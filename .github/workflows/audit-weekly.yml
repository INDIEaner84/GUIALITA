name: Weekly Repo Audit
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      scope:
        description: 'Audit scope'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - security-only
          - deps-only

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect package manager
        id: detect
        run: |
          if [ -f "package.json" ]; then echo "pm=npm" >> $GITHUB_OUTPUT; fi
          if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then echo "pm=pip" >> $GITHUB_OUTPUT; fi
          if [ -f "Cargo.toml" ]; then echo "pm=cargo" >> $GITHUB_OUTPUT; fi
          if [ -f "go.mod" ]; then echo "pm=go" >> $GITHUB_OUTPUT; fi

      - name: Run OpenCode Audit
        uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: openrouter/google/gemini-2.5-flash
          prompt: |
            Führe einen vollständigen wöchentlichen Audit durch.
            
            Erkanntes Package-Management: ${{ steps.detect.outputs.pm }}
            
            1. TESTS & COVERAGE
            - Führe verfügbare Tests aus (npm test / pytest / go test / cargo test)
            - Miss Coverage falls möglich
            - Identifiziere fehlende Tests
            
            2. DEPENDENCIES
            - Führe Security-Audit aus (npm audit / pip-audit / cargo audit)
            - Identifiziere veraltete Pakete
            - Prüfe auf kritische CVEs
            
            3. CODE-QUALITÄT
            - Analysiere Dateistruktur
            - Identifiziere große/komplexe Dateien
            - Prüfe auf TODO/FIXME/HACK Kommentare
            
            4. DOKUMENTATION
            - Prüfe README Vollständigkeit
            - Identifiziere undokumentierte Funktionen
            
            Erstelle ein GitHub Issue mit dem strukturierten Audit-Bericht.
            Nutze Markdown-Formatierung mit Tabellen für klare Lesbarkeit.
