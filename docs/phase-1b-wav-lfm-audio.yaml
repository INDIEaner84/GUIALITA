  - wav ingestion
  - lfm2.5-audio runtime verification
  - model loading
  - real inference
  - transcription
  - structured metadata
  - safe filename generation
  - wav rename/move
  - validation
  - tests
  - documentation

model:
  name: LFM2.5-Audio-1.5B
  vendor: Liquid AI
  architecture: lfm2
  format: GGUF v3 (Q4_0, 148 tensors)
  files:
    main: models/lfm-audio-1.5b/LFM2.5-Audio-1.5B-Q4_0.gguf
    main_size_bytes: 695750880
    mmproj: models/lfm-audio-1.5b/mmproj-LFM2.5-Audio-1.5B-Q4_0.gguf
    vocoder: models/lfm-audio-1.5b/vocoder-LFM2.5-Audio-1.5B-Q4_0.gguf
    tokenizer: models/lfm-audio-1.5b/tokenizer-LFM2.5-Audio-1.5B-Q4_0.gguf
  source: LiquidAI/LFM2.5-Audio-1.5B-GGUF (HuggingFace, 2026-08-03)

runtime:
  name: llama-liquid-audio-cli
  vendor: Liquid AI (official runner)
  location: runtime/liquid-audio/
  backend: CPU-only (libggml-cpu, no CUDA backend in runner)
  basis: "llama.cpp PR #18641 (WIP, not merged upstream)"
  libs: "libggml-base 0.9.5, libmtmd 0.0.7641"
  llama_cpp_python_installed: "0.3.35"
  llama_cpp_python_audio_api: none
  llama_cpp_python_text_inference_with_audio_model: PASS

compatibility:
  installed_runtime_audio: INCOMPATIBLE
  official_runner_audio: COMPATIBLE
  classification: "COMPATIBLE via official LiquidAI runner; llama-cpp-python 0.3.35 has no audio API"

lifecycle:
  mode: load-per-inference
  persistent: false
  vram_before_mib: 4708
  vram_during_mib: 4708
  vram_after_mib: 4708
  gpu_usage: none

audio_format:
  sample_rate: 16000
  channels: 1
  bit_depth: 16
  preprocessing: none (runner-internal audio encoder)

latency_ms_examples:
  model_load: [497, 1975]
  encode: [743, 5435]
  decode: [1174, 2054]
  total: [7113, 19506]

result_schema:
  audio_id: "AUDIO-000001 (counter file audio/.audio_id_counter)"
  confidence: null
  transcript: authoritative asr output

filename_scheme: "YYYYMMDD_HHMMSS__<slug>.wav (slug: [a-z0-9aeouess-], max 60, collision suffix -2/-3)"

directories:
  inbox: audio/inbox/
  processed: audio/processed/
  failed: audio/failed/

states:
  - DISCOVERED
  - VALIDATED
  - LOADING_MODEL
  - INFERENCE
  - RESULT_RECEIVED
  - METADATA_CREATED
  - RENAMING
  - COMPLETED
  - FAILED

error_handling:
  missing_wav: FAILED
  corrupt_wav: FAILED
  unsupported_wav: FAILED
  silent_wav: SILENT
  missing_model: MODEL_ERROR
  empty_transcript: NO_TRANSCRIPTION
  inference_error: INFERENCE_ERROR
  rename_error: FAILED (original preserved)
  metadata_error: FAILED (original preserved)

