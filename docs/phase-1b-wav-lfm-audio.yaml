known_issues:
  - "ASR quality for German espeak synthesis is poor (model is EN-focused)"
  - "runner is CPU-only; latency dominated by audio encode (0.7-5.4 s)"
  - "llama-liquid-audio-cli is WIP (PR #18641), not in stable llama.cpp"
  - "very short non-speech audio can produce short phantom transcript"
  - "runner primarily verified with 16 kHz mono"

known_risks:
  - "runner builds may change on HuggingFace (WIP status)"
  - "future llama.cpp may rename lfm2 architecture"
  - "disk nearly full (32 GB free); no further large downloads without approval"
  - "gguf package in venv only for verification, removable"

