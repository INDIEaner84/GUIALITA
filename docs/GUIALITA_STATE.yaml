  test_functions_total: 141
  suites: 9
  previous_claims: [108, 79, 71, 145]
  previous_claims_note: >
    Alle vier Angaben waren falsch. Drei Suiten starteten andere Suiten als
    Subprozesse; beim Lauf aller neun Suiten wurde test_memory.py achtmal und
    test_api.py sechsmal ausgeführt (35 Suite-Läufe statt 9), wodurch dieselben
