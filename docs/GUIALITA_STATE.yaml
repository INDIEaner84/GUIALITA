  phase_1c:
    title: "Voice → LFM → TTS (durchgehende Schleife)"
    status: NOT_STARTED
    authorization: REQUIRED
    frozen: true
    note: "Die Existenz von WAV-Dateien oder Einzelbausteinen ist KEINE Autorisierung."

  phase_2_vision:
    title: "LFM Vision / Perzeption"
    status: UNKNOWN
    note: "Modelle vorhanden, aber nicht angebunden. Umfang nicht definiert — es wird nicht spekuliert."

# ------------------------------------------------------------
# Architekturentscheidungen
# ------------------------------------------------------------
stt_architecture:
  status: DOCUMENTED
  decision: ADR-001
  adr: docs/adr/ADR-001-stt-whisper-cpp.md
  live_stt_runtime: "whisper.cpp (whisper-cli, ggml-base.bin, Sprache de)"
  cognition_runtime: "Granite 4.1 3B via llama-cpp-python (CUDA)"
  tts_runtime: "LFM2.5-Audio-1.5B via llama-liquid-audio-cli (CPU)"
  batch_asr_runtime: "LFM2.5-Audio-1.5B (scripts/process_audio.py, Phase 1B)"
  vision_runtime: "LFM2.5-VL — FUTURE, nicht angebunden"
  explicit: >
    LFM2.5-Audio stellt NICHT den deutschen Live-STT-Pfad bereit.
    Diese Rolle hat whisper.cpp. Die Entscheidung ist bewusst und begründet.

# ------------------------------------------------------------
# Reproduzierbarkeit / Portabilität
# ------------------------------------------------------------
reproducibility:
  status: PASS
  dependency_declaration: requirements.txt
  path_configuration: .env.example
  path_module: backend/paths.py
  hardcoded_absolute_paths_in_code: 0
  environment_variables:
    - GUIALITA_ROOT
    - GUIALITA_MODEL_ROOT
    - GUIALITA_EXTERNAL_MODEL_ROOT
    - GUIALITA_RUNTIME_ROOT
    - GUIALITA_DATA_ROOT
    - GUIALITA_WHISPER_CLI
    - GUIALITA_VENV
  external_non_pip_dependencies:
    - "whisper.cpp (whisper-cli)"
    - "llama-liquid-audio-cli"
    - "Ollama (optional, SHARED SERVICE, Port 11434)"
    - "Modelldateien (*.gguf, *.bin)"
  note: >
    Historische Phase-Reports enthalten weiterhin maschinenspezifische
    Pfade. Das ist beabsichtigt: sie sind forensische Belege und werden
    nicht nachträglich verändert.

# ------------------------------------------------------------
# Verifizierte Umgebung (Referenzmaschine)
# ------------------------------------------------------------
environment:
  os: "Linux Mint 22.3 (XFCE)"
  cpu: "Intel Core i7-3930K (6C/12T)"
  ram_gb: 32
  gpu: "NVIDIA GeForce GTX 1080 Ti, 11 GB"
  cuda_driver: "12.2"
  cuda_toolkit: "12.0.140"
  llama_cpp_python: "0.3.35 (GGML_CUDA=ON, GGML_CUDA_NO_VMM=ON)"
  backend: "FastAPI, Port 8080"
  ollama: "SHARED SERVICE, Port 11434 — wird nie gestoppt oder verändert"
  note: >
    Dies ist die Maschine, auf der die PASS-Ergebnisse erzielt wurden.
    Sie ist eine Referenz, keine Voraussetzung — die Pfadkonfiguration ist
    seit Phase 4E portabel.

# ------------------------------------------------------------
# Aktueller Stand und Grenzen
# ------------------------------------------------------------
current:
  last_completed_phase: phase_4e_hardening
  next_authorized_phase: NONE
  hard_stop: true
  recommended_next: voice_latency_remeasurement
  recommended_next_reason: >
    Einziges offenes Gate. Schließt voice_forensics_v1 ab und liefert die
    Messgrundlage für jede weitere Optimierungsentscheidung.

prohibitions:
  - "Phase 1C ohne explizite Autorisierung implementieren"
  - "MUSCAL-Adapter, Vision, Desktop-/Browser-Control, WebSocket, Multi-Agent"
  - "Cloud-STT/TTS oder Cloud-Inferenz"
  - "LFM2.5-Audio stillschweigend ersetzen (TTS-Rolle ist gesetzt)"
  - "whisper.cpp ohne neue ADR ersetzen (STT-Rolle ist per ADR-001 gesetzt)"
  - "eingefrorene Phasen (1A, 1B, Memory-Schichten) ohne Autorisierung ändern"
  - "Ollama stoppen oder umkonfigurieren"

known_issues:
  - "Sprach-Turn ~48 s warm (vor CUDA-Repair gemessen; Nachmessung offen)"
  - "whisper.cpp CPU-gebunden, ~14 s pro Transkription"
  - "Granite nutzt Konversationshistorie auf Deutsch nicht immer zuverlässig (Modellverhalten)"
  - "llama-liquid-audio-cli ist WIP (llama.cpp PR #18641), CPU-only"
  - "LFM2.5-Audio-ASR ist EN-fokussiert (Grund für ADR-001)"
  - "Selbst-Feedback-Schutz (Post-TTS-Cooldown) implementiert, Playback-Test unvollständig"
  - "leere Pulse-Buffer können -300 dBFS anzeigen (numerisches Rauschen, harmlos)"
  - "Audio-Device-Index ist systemabhängig (--list-devices)"

known_risks:
  - "Testsuiten benötigen laufendes Backend, echtes Mikrofon und GPU — nicht CI-fähig"
  - "VAD-Schwellen sind umgebungsabhängig"
  - "Runner-Builds auf HuggingFace können sich ändern (WIP)"
  - "Plattenplatz begrenzt — keine großen Downloads ohne Freigabe"

# ------------------------------------------------------------
# Zielarchitektur (NICHT implementiert)
# ------------------------------------------------------------
future_target:
  status: PLANNED
  note: >
    MUSCAL soll die übergeordnete Agenten-/Orchestrierungsschicht werden,
    GUIALITA bleibt die lokale Runtime darunter. Nichts davon ist
    implementiert; es ist ausschließlich Zielbild, kein Zustand.
