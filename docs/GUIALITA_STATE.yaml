    title: "Latenz-/Ursachenanalyse der Sprachpipeline"
    investigation_status: PASS       # Untersuchung abgeschlossen
    gate_status: OPEN                # abgeleitete Maßnahme NICHT abgeschlossen
    decision: PERFORMANCE_OPTIMIZATION_REQUIRED
    date: 2026-08-19
    measured_warm_turn_ms: 48000
    measured_stt_ms: 14000
    measured_llm_warm_ms: 23000
    closes_when: "Sprach-Turn-Latenz nach dem CUDA-Repair neu gemessen und dokumentiert"
    note: >
      Der CUDA-VMM-Repair adressiert die primäre Ursache (LLM auf CPU).
      Es existiert jedoch KEINE Nachmessung der vollständigen Sprachpipeline
      nach dem Repair. Das Performance-Gate bleibt deshalb OPEN.
    evidence: [docs/PHASE_VOICE_FORENSICS_V1_RESULT.md, docs/phase-voice-forensics-v1.yaml]

  cuda_vmm_repair:
    title: "Wiederherstellung der CUDA-GPU-Beschleunigung"
    status: PASS
    date: 2026-08-20
    root_causes:
      - "CUDA-VMM-Crash (cuMemAddressReserve)"
      - "Xid-31-MMU-Fault / Treiberzustand"
      - "geteiltes Debian-CUDA-Toolkit ohne /usr/local/cuda"
    fix: "Neubau mit GGML_CUDA_NO_VMM=ON, Reboot, CUDA-Symlinks"
    gpu_layers_offloaded: "41/41"
    measured_llm_warm_ms: 6000       # isolierte LLM-Inferenz, nicht ganzer Turn
    regression: "79/79 PASS"
    evidence: [docs/PHASE_CUDA_VMM_REPAIR_RESULT.md, docs/phase-cuda-vmm-repair.yaml]

