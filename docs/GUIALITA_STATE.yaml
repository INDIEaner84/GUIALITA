# ------------------------------------------------------------
# Statusvokabular — bewusst unterschieden, nicht vermischen
# ------------------------------------------------------------
status_vocabulary:
  PASS: "funktional getestet, Ergebnis dokumentiert"
  OBSERVED: "gemessen/beobachtet, kein Gate bestanden oder nicht abgeschlossen"
  DOCUMENTED: "beschrieben und entschieden, kein Testgate anwendbar"
  OPEN: "Untersuchung abgeschlossen, abgeleitete Maßnahme offen"
  UNKNOWN: "keine Evidenz im Repository — es wird nicht spekuliert"
  NOT_STARTED: "keine Implementierung vorhanden"
  BLOCKED: "wartet auf explizite Autorisierung"
  PERFORMANCE_OPTIMIZATION_REQUIRED: "funktional korrekt, Latenz inakzeptabel"

project:
  name: GUIALITA
  role: "lokale kognitive/Audio-Runtime (HTTP)"
  overall_status: PASS
  current_baseline: GUIALITA-CUDA-VMM-REPAIR-PASS
  baseline_history:
    - GUIALITA-PHASE-0-PASS
    - GUIALITA-TTS-V1-PASS
    - GUIALITA-VOICE-ACTIVATION-V1-PASS
    - GUIALITA-CUDA-VMM-REPAIR-PASS   # aktuell
  baseline_note: >
    Frühere Dokumente nennen abweichende "current baselines"
    (TTS-V1 bzw. VOICE-ACTIVATION-V1). Diese Angaben sind historisch
    korrekt für ihren Entstehungszeitpunkt, aber nicht mehr aktuell.
    Maßgeblich ist ausschließlich project.current_baseline.

