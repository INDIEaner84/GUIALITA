  nested_suite_calls: "standardmäßig deaktiviert (GUIALITA_TEST_NESTED=1 reaktiviert)"
  grading_rule: >
    Tests aus einer NOT_EXECUTED-Suite zählen nicht als bestanden, auch wenn
