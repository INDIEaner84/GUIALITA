    test_tts.py: {tests: 16, requires: "backend, tts-runtime"}
    test_memory_graph.py: {tests: 14, requires: "backend, llm"}
    test_graph_visualization.py: {tests: 13, requires: backend}
    test_process_audio.py: {tests: 5, requires: "lfm-audio-runtime, espeak-ng"}
    test_capture.py: {tests: 0, requires: "mikrofon, espeak-ng"}
  additional_mainline_suites:
    # Hinzugekommen über den M5-Audit/Export-Zweig (Hauptzweig).
    test_audit.py: {requires: backend}
    test_chat_service.py: {requires: backend, llm}
    test_audio_contract.py: {requires: backend}
  capability_probe: >
    scripts/run_all_tests.py prüft vor dem Lauf über /health, /audio/status und
    /audio/tts/status, welche Fähigkeiten vorhanden sind. Fehlt eine benötigte,
    wird die Suite als NOT_EXECUTED mit benannter Ursache geführt statt als FAIL.
  ci_capable: false
