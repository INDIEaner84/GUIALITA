phase: memory-graph-foundation-v1
status: PASS
baseline_after: GUIALITA-MEMORY-GRAPH-V1-PASS
baseline_before: GUIALITA-MEMORY-RETRIEVAL-V1-PASS
date: "2026-08-19"
classification: "FACT/OBSERVED/VERIFIED nur belegte Ergebnisse; INFERENCE markiert"

objective: "Persistente Graph-Darstellung (Entitäten + Beziehungen) über der Memory-Schicht"

architecture:
  entity_extraction: "deterministisch, regelbasiert (Wortschatz + Zitate + Pfade + Großbuchstaben)"
  relation_extraction: "pattern-basiert (uses/is_a/has/related_to) + Co-occurrence"
  storage: "SQLite (entities + relations Tabellen)"
  traversal: "1-Hop (outgoing + incoming)"
  graph_in_chat: "OPTIONAL / INSPECTABLE (nicht automatisch)"

schema_v3:
  entities:
    columns: [id, canonical_name, entity_type, extraction_version, metadata_json, created_at]
    id_format: "ENT-<hex>"
    unique: "(canonical_name, entity_type)"
    indexes: [entities(canonical_name), entities(entity_type)]
  relations:
    columns: [id, source_entity_id, relation_type, target_entity_id, source_memory_id, extraction_version, metadata_json, created_at]
    id_format: "REL-<hex>"
    unique: "(source_entity_id, relation_type, target_entity_id, source_memory_id)"
    indexes: [relations(source_entity_id), relations(target_entity_id), relations(source_memory_id)]

extraction:
  version: 1
  known_entities: 53
  relation_types: [uses, is_a, has, related_to]
  methods: [known_vocabulary, quoted_terms, file_paths, capitalized_words]
  false_positives: "dokumentiert und akzeptabel (Großbuchstaben-Erkennung)"

