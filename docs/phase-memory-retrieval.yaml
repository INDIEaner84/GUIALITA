objective: "Deterministisches lokales Memory-Retrieval für Cross-Session-Wissen"

architecture:
  embedding:
    method: feature_hashing
    dimensions: 512
    version: 1
    dependencies: numpy (bereits vorhanden)
    deterministic: true
    cpu_only: true
    no_network: true
  retrieval:
    method: brute_force_cosine_similarity
    min_score: 0.15
    top_k: 4
    max_retrieval_chars: 6000
    scope: global
  storage: "SQLite BLOB in memories-Tabelle"

schema_v2:
  memories:
    columns: [id, source_message_id, session_id, content, embedding, embedding_version, created_at, metadata_json]
    id_format: "MEM-<hex>"
    embedding_format: "numpy float64 bytes (512 * 8 = 4096 bytes)"
    indexes: [memories(session_id, created_at), memories(source_message_id)]
    migration: "V1→V2 idempotent (CREATE TABLE IF NOT EXISTS)"

