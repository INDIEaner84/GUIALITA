chat_pipeline:
  flow:
    - validate request
    - resolve/create session
    - persist user message
    - retrieve relevant older memories
    - load recent session history
    - build bounded context (memories + history)
    - call ModelManager
    - persist assistant response
    - index both messages
    - return response with retrieval metadata
  fallback: "Retrieval-Fehler → reine History"

known_limitations:
  - "Feature-Hashing ist KEIN neuronales semantisches Embedding"
  - "Qualitaet haengt von Token-Overlap ab"
  - "Brute-Force Suche (linear) — bei >10k Memories wird Vektor-DB noetig"
  - "Keine Memory-Aktualisierung oder Löschung"
  - "Keine semantische Zusammenfassung"

deferred:
  - "Neuronales Embedding-Modell (bei >10k Memories)"
  - "Vektor-DB (FAISS/Chroma)"
  - "Memory-Aktualisierung und Löschung"
  - "Graph Memory / GraphRAG"
