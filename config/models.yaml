# GUIALITA - Model-Konfiguration
# Primär: llama-cpp-python (dediziert für GUIALITA)
# Sekundär: Ollama (SHARED SERVICE - wird nur erkannt/verwendet, nie beendet)

default_model: granite-3b
default_adapter: llamacpp
fallback_adapter: ollama

server:
  host: 0.0.0.0
  port: 8080
  ollama_url: http://127.0.0.1:11434

# Speech-to-Text (Phase 1)
# Grund: llama_cpp_python hat keinen Audio-Support. LFM2.5-Audio ist daher
# nicht direkt als STT nutzbar. Verwendet wird die vorhandene lokale
# whisper.cpp-Runtime (bereits gebaut).
stt:
  engine: whisper.cpp
  cli_path: /home/hz/whisper.cpp/build/bin/whisper-cli
  model_path: models/whisper/ggml-base.bin
  language: de
  sample_rate: 16000
  max_audio_bytes: 25000000

# Hinweis: exFAT unterstützt keine Symlinks.
# Die Granite-Modelle werden direkt über ihren Originalpfad referenziert.
models:
  granite-3b:
    name: granite-4.1-3b
    adapter: llamacpp
    path: /media/hz/_Ext_Seagat/AiEnvHz/LFM Granite Muscal/models/granite/3b/granite-4.1-3b-Q4_K_M.gguf
    n_ctx: 4096
    n_gpu_layers: 99
    max_tokens: 512
    chat_template: granite

  granite-8b:
    name: granite-4.1-8b
    adapter: llamacpp
    path: /media/hz/_Ext_Seagat/AiEnvHz/LFM Granite Muscal/models/granite/8b/granite-4.1-8b-Q4_K_M.gguf
    n_ctx: 4096
    n_gpu_layers: 99
    max_tokens: 512
    chat_template: granite

  lfm-agent-8b:
    name: LFM2.5-8B-A1B
    adapter: llamacpp
    path: /media/hz/_Ext_Seagat/AiEnvHz/LFM Granite Muscal/models/lfm/agent/LFM2.5-8B-A1B-Q4_K_M.gguf
    n_ctx: 4096
    n_gpu_layers: 99
    max_tokens: 512
    chat_template: llama3

  lfm-vision-3b:
    name: LFM2.5-VL-3B
    adapter: llamacpp
    path: models/lfm-vision-3b/LFM2.5-VL-3B-Q4_K_M.gguf
    mmproj: models/lfm-vision-3b/mmproj-LFM2.5-VL-3B-Q8_0.gguf
    n_ctx: 4096
    n_gpu_layers: 99
    max_tokens: 512
    chat_template: llama3

  lfm-vision-1.6b:
    name: LFM2.5-VL-1.6B
    adapter: llamacpp
    path: models/lfm-vision-1.6b/LFM2.5-VL-1.6B-Q4_K_M.gguf
    mmproj: models/lfm-vision-1.6b/mmproj-LFM2.5-VL-1.6b-Q8_0.gguf
    n_ctx: 4096
    n_gpu_layers: 99
    max_tokens: 512
    chat_template: llama3

  lfm-audio-1.5b:
    name: LFM2.5-Audio-1.5B
    adapter: llamacpp
    path: models/lfm-audio-1.5b/LFM2.5-Audio-1.5B-Q4_0.gguf
    mmproj: models/lfm-audio-1.5b/mmproj-LFM2.5-Audio-1.5B-Q4_0.gguf
    tokenizer: models/lfm-audio-1.5b/tokenizer-LFM2.5-Audio-1.5B-Q4_0.gguf
    vocoder: models/lfm-audio-1.5b/vocoder-LFM2.5-Audio-1.5B-Q4_0.gguf
    n_ctx: 4096
    n_gpu_layers: 99
    max_tokens: 512
    chat_template: llama3
